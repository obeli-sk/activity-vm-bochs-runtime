name: runtime

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: Docker Hub tag, defaults to the commit SHA
        required: false
        type: string
      push:
        description: Push the runtime to Docker Hub
        default: false
        required: false
        type: boolean

permissions:
  contents: read

env:
  IMAGE_BASE: docker.io/getobelisk/activity-vm-runtime

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v21
      - uses: DeterminateSystems/magic-nix-cache-action@v13

      - name: Build and test
        run: nix flake check --print-build-logs

      - name: Stage runtime
        run: |
          nix build --print-build-logs
          mkdir -p builds
          cp result/activity-vm-runtime.wasm builds/
          sha256sum builds/activity-vm-runtime.wasm | tee builds/SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: activity-vm-runtime-${{ github.sha }}
          path: builds/
          if-no-files-found: error
          retention-days: 7

      - uses: oras-project/setup-oras@v1
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.push) || startsWith(github.ref, 'refs/tags/v') }}

      - name: Push runtime to Docker Hub
        id: push
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.push) || startsWith(github.ref, 'refs/tags/v') }}
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="$INPUT_TAG"
          if [[ -z "$tag" ]]; then
            tag="${GITHUB_REF_NAME:-$GITHUB_SHA}"
          fi
          echo "$DOCKER_HUB_TOKEN" | oras login docker.io -u "$DOCKER_HUB_USERNAME" --password-stdin
          cd builds
          wasm_digest=$(cut -d ' ' -f 1 SHA256SUMS)
          created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          printf '%s\n' \
            "{\"created\":\"$created\",\"author\":null,\"architecture\":\"wasm\",\"os\":\"wasip1\",\"layerDigests\":[\"sha256:$wasm_digest\"],\"component\":null}" \
            > wasm-config.json
          oras push "${IMAGE_BASE}:${tag}" \
            --config wasm-config.json:application/vnd.wasm.config.v0+json \
            --annotation dev.obelisk.artifact.kind=activity-vm-runtime.v1 \
            "activity-vm-runtime.wasm:application/wasm"
          descriptor=$(oras manifest fetch --descriptor "${IMAGE_BASE}:${tag}")
          echo "$descriptor"
          manifest_digest=$(printf '%s' "$descriptor" | jq -r .digest)
          echo "reference=oci://${IMAGE_BASE}:${tag}@${manifest_digest}" >> "$GITHUB_OUTPUT"

      # On a v* tag, open a PR against obelisk bumping the runtime's pinned OCI
      # reference. Needs a PAT (RUNTIME_TO_OBELISK_PR) with push+PR rights on
      # obeli-sk/obelisk. Only the version file changes: the activity VM runtime
      # is fetched at runtime, not embedded, so no flake.nix outputHash bump.
      - name: Open obelisk version-bump PR
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ secrets.RUNTIME_TO_OBELISK_PR }}
          REFERENCE: ${{ steps.push.outputs.reference }}
          TAG: ${{ github.ref_name }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/obeli-sk/obelisk.git" obelisk-clone
          cd obelisk-clone
          branch="bump/activity-vm-runtime-${TAG}"
          git switch -c "$branch"
          printf '%s' "$REFERENCE" > crates/embedded-assets/activity-vm-runtime-version.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add crates/embedded-assets/activity-vm-runtime-version.txt
          git commit -m "chore: bump activity-vm-runtime to ${TAG}"
          git push origin "$branch"
          # shellcheck disable=SC2016  # backticks in the printf format are literal markdown
          body=$(printf 'Automated bump of the activity VM runtime OCI reference to `%s`.\n\nReference: `%s`\n' "$TAG" "$REFERENCE")
          gh pr create --repo obeli-sk/obelisk --base main --head "$branch" \
            --title "chore: bump activity-vm-runtime to ${TAG}" \
            --body "$body"
